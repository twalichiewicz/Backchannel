name: Comment and discussion capture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
